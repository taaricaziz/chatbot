<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeBot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <span class="chat-header-icon">☕</span>
      <div class="chat-header-text">
        <h1>CafeBot</h1>
        <p>Your café ordering assistant</p>
      </div>
    </header>

    <main class="chat-area" id="chatArea" role="log" aria-live="polite" aria-label="Conversation with CafeBot">
      <div class="message bot">
        <div class="bubble">Hi there! Welcome to CafeBot ☕ What can I get started for you today?</div>
      </div>
    </main>

    <form class="chat-input-bar" id="chatForm">
      <input
        type="text"
        id="chatInput"
        class="chat-input"
        placeholder="Type your message..."
        autocomplete="off"
        aria-label="Type your message"
      />
      <button type="submit" class="send-button" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
        </svg>
      </button>
    </form>
  </div>

  <script src="chat.js"></script>
</body>
</html>
