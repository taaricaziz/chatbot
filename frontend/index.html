<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gootee Cafe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <svg class="chat-header-logo" viewBox="0 0 48 48" width="36" height="36" role="img" aria-label="Gootee Cafe logo">
        <circle cx="24" cy="24" r="24" fill="#fffaf5" />
        <path d="M12 20h18v9a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z" fill="#4b2e1e" />
        <path d="M30 22h3.5a4 4 0 0 1 0 8H30" fill="none" stroke="#4b2e1e" stroke-width="2.5" stroke-linecap="round" />
        <path d="M18 15c-1.4-1.8 1.4-1.8 0-3.6" stroke="#4b2e1e" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M24 15c-1.4-1.8 1.4-1.8 0-3.6" stroke="#4b2e1e" stroke-width="2" fill="none" stroke-linecap="round" />
      </svg>
      <div class="chat-header-text">
        <h1>Gootee Cafe</h1>
        <p>Your café ordering assistant</p>
      </div>
    </header>

    <main class="chat-area" id="chatArea" role="log" aria-live="polite" aria-label="Conversation with Gootee Cafe">
      <div class="message bot">
        <div class="bubble">Hi there! Welcome to Gootee Cafe ☕ What can I get started for you today?</div>
      </div>
    </main>

    <form class="chat-input-bar" id="chatForm">
      <input
        type="text"
        id="chatInput"
        class="chat-input"
        placeholder="Type your message..."
        autocomplete="off"
        aria-label="Type your message"
      />
      <button type="submit" class="send-button" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
        </svg>
      </button>
    </form>
  </div>

  <script src="chat.js"></script>
</body>
</html>
