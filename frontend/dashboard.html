<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gootee Cafe — Staff Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="dashboard-header">
    <div class="dashboard-header-title">
      <svg class="dashboard-header-logo" viewBox="0 0 48 48" width="32" height="32" role="img" aria-label="Gootee Cafe logo">
        <circle cx="24" cy="24" r="24" fill="#fffaf5" stroke="#e6dccd" stroke-width="1.5" />
        <path d="M12 20h18v9a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z" fill="#4b2e1e" />
        <path d="M30 22h3.5a4 4 0 0 1 0 8H30" fill="none" stroke="#4b2e1e" stroke-width="2.5" stroke-linecap="round" />
        <path d="M18 15c-1.4-1.8 1.4-1.8 0-3.6" stroke="#4b2e1e" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M24 15c-1.4-1.8 1.4-1.8 0-3.6" stroke="#4b2e1e" stroke-width="2" fill="none" stroke-linecap="round" />
      </svg>
      <h1>Gootee Cafe Kitchen Dashboard</h1>
    </div>
    <button id="refreshBtn" type="button">Refresh</button>
  </header>

  <main id="ordersContainer" class="orders-container">
    <p class="empty-state">Loading orders...</p>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
